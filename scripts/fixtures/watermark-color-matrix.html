<!doctype html><meta charset="utf-8"><style>body{margin:24px;background:#eceae5;color:#282c31;font:13px system-ui}h1{font-size:20px}#cases{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.case{background:white;border-radius:10px;padding:12px}canvas{width:100%;height:100px;display:block;border-radius:6px}p{margin:8px 0 0;font-size:11px;color:#666}</style><h1>自动配色 · 20 种底色与图案对照</h1><div id="cases"></div><script type="module">
import {analyzeWatermarkColor} from '/src/pages/watermark/adaptive-color.ts';
import {colorCases,casePixels} from './watermark-color-cases.js';
for(const item of colorCases){const pixels=casePixels(item);const result=analyzeWatermarkColor(pixels);const card=document.createElement('div');card.className='case';const canvas=document.createElement('canvas');canvas.width=576;canvas.height=200;const ctx=canvas.getContext('2d');const bg=document.createElement('canvas');bg.width=96;bg.height=64;bg.getContext('2d').putImageData(new ImageData(pixels,96,64),0,0);ctx.drawImage(bg,0,0,576,200);ctx.fillStyle=result.color;ctx.font='32px "Songti SC",serif';ctx.fillText('山川异域 · 风月同天',22,110);const note=document.createElement('p');note.textContent=`${item.name} · ${result.color} · 区域可读覆盖 ${Math.round(result.coverage*100)}%`;card.append(canvas,note);document.getElementById('cases').append(card);}
</script>
